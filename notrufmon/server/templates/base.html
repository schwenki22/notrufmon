<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}notrufmon{% endblock %}</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#667085; --line:#e3e6eb;
          --accent:#2457c5; --ok:#1e8e3e; --warn:#b26a00; --bad:#c62828; --code:#eef1f5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111318; --card:#1a1d24; --fg:#e7e9ee; --muted:#9aa3b2; --line:#2b303a;
            --accent:#7aa2ff; --ok:#4cc26b; --warn:#f0b44c; --bad:#ff6b6b; --code:#232733; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:12px 20px; display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
  header b { font-size:17px; } header a { color:var(--fg); text-decoration:none; } header a:hover { color:var(--accent); }
  main { max-width:1200px; margin:0 auto; padding:20px 16px 60px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-bottom:16px; }
  h1 { font-size:22px; margin:4px 0 16px; } h2 { font-size:16px; margin:0 0 12px; }
  table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:13px; }
  .scroll { overflow-x:auto; }
  a { color:var(--accent); }
  .ok { color:var(--ok); font-weight:600; } .bad { color:var(--bad); font-weight:600; } .warn { color:var(--warn); font-weight:600; }
  .muted { color:var(--muted); font-size:13px; }
  .msg { border-left:4px solid var(--ok); } .err { border-left:4px solid var(--bad); }
  label { display:block; font-weight:600; margin-top:10px; }
  select, input[type=text], input[type=number], input[type=password], input[type=datetime-local] { width:100%; max-width:520px; padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:4px 24px; }
  button, .btn { display:inline-block; padding:8px 14px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; font:inherit; cursor:pointer; text-decoration:none; }
  button.secondary, .btn.secondary { background:transparent; color:var(--accent); }
  button.danger { background:var(--bad); border-color:var(--bad); }
  .actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .actions form { margin:0; }
  code, pre { background:var(--code); border-radius:6px; font:13px/1.4 ui-monospace,Consolas,monospace; }
  code { padding:1px 5px; } pre { padding:10px 12px; overflow-x:auto; white-space:pre-wrap; word-break:break-all; }
  .res-ok { color:var(--ok); font-weight:600; } .res-bad { color:var(--bad); font-weight:600; } .res-warn { color:var(--warn); font-weight:600; }
  .pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; border:1px solid var(--line); }
</style>
</head>
<body>
<header><b>notrufmon</b><a href="/admin/">Standorte</a><a href="/admin/sites/new">Neuer Standort</a><a href="/admin/tests">Testanrufe</a><span class="muted">v{{ version }}</span></header>
<main>
{% if msg %}<div class="card msg">{{ msg }}</div>{% endif %}
{% if err %}<div class="card err">{{ err }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
